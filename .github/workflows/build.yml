name: Build HRMS Image

# Builds a Frappe image that contains the apps listed in apps.json
# (currently erpnext + hrms, both on the version-16 branches) and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/frappe-hrms:v16.
#
# The Containerfile is the stock one from frappe/frappe_docker; this repo only
# defines which apps go into the image. Two things worth knowing:
#  1. The apps.json secret source must live inside the build context (builder/),
#     because buildx resolves secret `src=` paths relative to the context.
#  2. CACHE_BUST is the workflow run id: secret contents are not part of Docker
#     layer cache keys, so without it a re-run would silently reuse the previous
#     (possibly app-less) `bench init` layer instead of fetching the apps again.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: hrms-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Checkout frappe_docker (builder)
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: main
          path: builder

      - name: Stage apps.json inside the build context
        run: |
          mkdir -p builder/.ci
          cp apps.json builder/.ci/apps.json

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frappe-hrms" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (load locally)
        uses: docker/build-push-action@v7
        with:
          context: builder
          file: builder/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=builder/.ci/apps.json
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:v16
          cache-from: type=gha,scope=frappe-hrms
          cache-to: type=gha,mode=max,scope=frappe-hrms

      - name: Verify apps are present in the image
        run: |
          docker run --rm --entrypoint bash "${{ env.IMAGE }}:v16" -lc '
            set -e
            for app in frappe erpnext hrms; do
              test -d "/home/frappe/frappe-bench/apps/$app" || { echo "missing app: $app"; exit 1; }
            done
            bench version
            ls /home/frappe/frappe-bench/assets
          '

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          docker tag "${{ env.IMAGE }}:v16" "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:v16"
          docker push "${{ env.IMAGE }}:latest"

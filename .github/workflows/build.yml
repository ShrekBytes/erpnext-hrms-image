name: Build HRMS Image

# Builds a Frappe image that contains the apps listed in apps.json
# (currently erpnext + hrms, both on the version-16 branches) and pushes it to
# GitHub Container Registry.
#
# Tags pushed:
#   :v16                          moving - newest verified build
#   :latest                       moving - same image as :v16
#   :erpnext-vX-hrms-vY           pin    - names BOTH app versions in the image
#   :build-<run id>-<attempt>     pin    - unique per workflow run, never reused
# For production, deploy by digest (printed in the run summary), not by tag.
#
# Builds run when apps.json is changed by hand, when *Watch for Stable Releases*
# dispatches this workflow after bumping the pins (a push made with GITHUB_TOKEN
# does not trigger workflows, so the watcher dispatches explicitly), and
# manually via *Actions -> Build HRMS Image -> Run workflow*.
# Nothing is pushed unless the integration test (ci/integration-test.sh) passes.
#
# The Containerfile is the stock one from frappe/frappe_docker; this repo only
# defines which apps go into the image. Two things worth knowing:
#  1. The apps.json secret source must live inside the build context (builder/),
#     because buildx resolves secret `src=` paths relative to the context.
#  2. CACHE_BUST is the workflow run id: secret contents are not part of Docker
#     layer cache keys, so without it a re-run would silently reuse the previous
#     `bench init` layer instead of fetching the apps again.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: hrms-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout frappe_docker (builder)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: frappe/frappe_docker
          # Pinned for reproducible builds. To update: bump this SHA, review
          # upstream's images/layered/Containerfile diff, let CI test it.
          ref: 85ad653360e4670c2e885c4283d293e7b9efeda9
          path: builder

      - name: Stage apps.json inside the build context
        run: |
          mkdir -p builder/.ci
          cp apps.json builder/.ci/apps.json

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erpnext-hrms" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (load locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: builder
          file: builder/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=builder/.ci/apps.json
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:v16
          cache-from: type=gha,scope=erpnext-hrms
          cache-to: type=gha,mode=max,scope=erpnext-hrms

      - name: Determine app versions and tag names
        run: |
          out=$(docker run --rm --entrypoint bash "${{ env.IMAGE }}:v16" -lc 'bench version')
          echo "$out"
          frappe=$(awk '$1=="frappe"{print $2}' <<<"$out")
          erpnext=$(awk '$1=="erpnext"{print $2}' <<<"$out")
          hrms=$(awk '$1=="hrms"{print $2}' <<<"$out")
          for v in "$frappe" "$erpnext" "$hrms"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "could not read app versions from image"; exit 1; }
          done
          echo "VERSION_TAG=erpnext-v${erpnext}-hrms-v${hrms}" >> "$GITHUB_ENV"
          echo "BUILD_TAG=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          {
            echo "### Image contents"
            echo ""
            echo "| app | version |"
            echo "|---|---|"
            echo "| frappe | ${frappe} |"
            echo "| erpnext | ${erpnext} |"
            echo "| hrms | ${hrms} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integration test (erpnext + hrms on a real site, migrate, doctor)
        run: ci/integration-test.sh "${{ env.IMAGE }}:v16"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        run: |
          set -euo pipefail
          for t in latest "${VERSION_TAG}" "${BUILD_TAG}"; do
            docker tag "${IMAGE}:v16" "${IMAGE}:$t"
          done
          for t in v16 latest "${VERSION_TAG}" "${BUILD_TAG}"; do
            docker push "${IMAGE}:$t"
          done
          digest=$(docker image inspect "${IMAGE}:v16" --format '{{index .RepoDigests 0}}')
          {
            echo ""
            echo "### Tags pushed"
            echo ""
            echo "- \`${IMAGE}:v16\` (moving)"
            echo "- \`${IMAGE}:latest\` (moving)"
            echo "- \`${IMAGE}:${VERSION_TAG}\` (pin)"
            echo "- \`${IMAGE}:${BUILD_TAG}\` (pin)"
            echo ""
            echo "### Deploy by digest (production)"
            echo ""
            echo "\`ERPNEXT_IMAGE=${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Watch for Stable Releases

# Stable-only policy: apps.json pins ERPNext and HRMS to *release tags* - branch
# heads are never built. This job is the only thing that moves those pins: it
# polls the upstream release tags daily and, when a newer v16 release exists,
# bumps apps.json, commits, and dispatches *Build HRMS Image* explicitly (a push
# made with GITHUB_TOKEN never triggers other workflows by itself). The build
# runs an integration test before publishing anything.
#
# If a build fails its verification, the previously published tags stay valid,
# so a bad bump never reaches a server.

on:
  workflow_dispatch:
  schedule:
    # Daily 04:00 UTC. GitHub pauses schedules after 60 days without repository
    # activity; re-enable from the Actions tab if the checks ever stop.
    - cron: "0 4 * * *"

permissions:
  contents: write
  actions: write   # needed to dispatch build.yml

concurrency:
  group: release-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare pinned versions with upstream releases
        id: check
        run: |
          set -euo pipefail
          pinned_erpnext=$(jq -r '.[] | select(.url == "https://github.com/frappe/erpnext") | .branch' apps.json)
          pinned_hrms=$(jq -r '.[] | select(.url == "https://github.com/frappe/hrms") | .branch' apps.json)
          latest_tag() { # stable vMAJOR.MINOR.PATCH only: no beta/rc, all pages
            gh api --paginate "repos/frappe/$1/tags?per_page=100" --jq '.[].name' |
              grep -E '^v16\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          latest_erpnext=$(latest_tag erpnext)
          latest_hrms=$(latest_tag hrms)
          if [ -z "$latest_erpnext" ] || [ -z "$latest_hrms" ]; then
            echo "::error::could not determine latest stable v16 tags (erpnext='$latest_erpnext' hrms='$latest_hrms')"
            exit 1
          fi

          echo "erpnext: pinned $pinned_erpnext | latest release $latest_erpnext"
          echo "hrms:    pinned $pinned_hrms | latest release $latest_hrms"

          is_newer() { # is_newer <pinned> <latest>
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]
          }

          {
            echo "### Release check"
            echo ""
            echo "| app | pinned | latest v16 release | action |"
            echo "|---|---|---|---|"
            if is_newer "$pinned_erpnext" "$latest_erpnext"; then a="bump"; else a="none"; fi
            if is_newer "$pinned_hrms" "$latest_hrms"; then b="bump"; else b="none"; fi
            echo "| erpnext | $pinned_erpnext | $latest_erpnext | $a |"
            echo "| hrms | $pinned_hrms | $latest_hrms | $b |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$a" = "bump" ] || [ "$b" = "bump" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "erpnext=$latest_erpnext" >> "$GITHUB_OUTPUT"
            echo "hrms=$latest_hrms" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump pins to the newer releases
        if: steps.check.outputs.update == 'true'
        env:
          new_erpnext: ${{ steps.check.outputs.erpnext }}
          new_hrms: ${{ steps.check.outputs.hrms }}
        run: |
          set -euo pipefail
          jq --arg e "$new_erpnext" --arg h "$new_hrms" \
            'map(if .url == "https://github.com/frappe/erpnext" then .branch = $e
                 elif .url == "https://github.com/frappe/hrms" then .branch = $h
                 else . end)' apps.json > apps.json.tmp
          mv apps.json.tmp apps.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(apps): stable bump to erpnext $new_erpnext, hrms $new_hrms"
          git push
          gh workflow run build.yml --ref main
          echo "Pins bumped. *Build HRMS Image* was dispatched to build and test this commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Already current
        if: steps.check.outputs.update == 'false'
        run: echo "Pins already match the latest v16 releases. No build needed." >> "$GITHUB_STEP_SUMMARY"